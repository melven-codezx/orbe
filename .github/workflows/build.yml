name: Build Orbe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK do Orbe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Gradle assembleRelease + lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease lint

      - name: Verificar APK (badging)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging app/build/outputs/apk/release/app-release.apk | grep -E "package:|application-label|launchable-activity"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Orbe-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release com APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
